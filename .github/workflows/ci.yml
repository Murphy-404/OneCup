name: Validate personal edition
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build-and-test:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run build
      - run: npm test
  docker-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - run: docker compose config --quiet
      - run: docker compose up -d --build
      - run: curl --fail --retry 10 --retry-all-errors --retry-delay 2 http://127.0.0.1:8080/healthz
      - run: node scripts/check-server.mjs http://127.0.0.1:8080
      - run: node scripts/ci-persistence.mjs seed
      - run: docker compose exec -T onecup node server-dist/cli.mjs backup /data/backups/ci.sqlite
      - run: docker compose up -d --force-recreate
      - run: curl --fail --retry 10 --retry-all-errors --retry-delay 2 http://127.0.0.1:8080/healthz
      - run: node scripts/ci-persistence.mjs check
      - run: node scripts/ci-persistence.mjs change
      - run: docker compose exec -T onecup node server-dist/cli.mjs verify /data/backups/ci.sqlite
      - run: docker compose exec -T onecup node server-dist/cli.mjs restore /data/backups/ci.sqlite --confirm-replace
      - run: node scripts/ci-persistence.mjs check
      - if: always()
        run: docker compose logs
      - if: always()
        run: docker compose down
